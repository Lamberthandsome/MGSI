# Managed-cache policy profile. Deployment must register one owner per slot.
# These values specify this profile, not unknown settings of historical runs.
taskmanager.memory.process.size=8192m
taskmanager.numberOfTaskSlots=4
taskmanager.memory.managed.size=2048m
mgsi.cache.pool.bytes=536870912
mgsi.cache.page.bytes=32768
mgsi.cache.decoded.buffer.bytes=16777216

# The cache pool is included in managed memory. Do not add it to process size.
# Shared-heap spatial comparisons use their separately recorded JVM pool.
